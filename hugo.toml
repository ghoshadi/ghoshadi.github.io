    name = "Home"
    pageRef = "/"
    weight = 10

  [[menus.main]]
    name = "Research"
    pageRef = "/publications"
    weight = 20

  [[menus.main]]
    name = "Teaching"
    pageRef = "/teaching"
    weight = 30

  [[menus.main]]
    name = "PLRD"
    url = "https://ghoshadi.github.io/plrd/"
    weight = 40

  [[menus.main]]
    name = "CV"
    url = "/files/Aditya_CV.pdf"
    weight = 50

