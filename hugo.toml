baseURL = "https://ghoshadi.github.io/"
languageCode = "en-us"
title = "Aditya Ghosh"
disableKinds = ["taxonomy", "term"]

[params]
  fontset = "garamond-inter"
  palette = "moonlight"
  description = "Aditya Ghosh — Ph.D. candidate in Statistics at Stanford University."
  author = "Aditya Ghosh"
  researchSummary = "My research focuses on developing robust methods for causal inference in modern settings, motivated by applications in economics, medicine, public policy, and operations research. I am particularly interested in problems involving complex dynamics, units interacting with shared resources, and distribution shifts across locations and time periods. I also work on designing methods that achieve both precision and robustness to specification when multiple analytic choices are defensible."

